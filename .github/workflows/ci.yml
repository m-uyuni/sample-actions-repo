name: CI Pipeline

on: [push, pull_request]  # Triggers on push/PR

jobs:
  test:
    runs-on: ubuntu-latest  # Free Linux runner
    steps:
      - uses: actions/checkout@v4  # Check out code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python hello.py  # Run your script